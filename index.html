<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>VCNS Tech &mdash; Plugin Updates</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:720px;margin:60px auto;padding:0 20px;color:#333;line-height:1.6}
    h1{color:#2D2C94;margin-bottom:4px}
    .meta{color:#555;margin-bottom:32px}
    a{color:#2D2C94}
    code{background:#f5f5f5;padding:2px 6px;border-radius:4px;font-size:.9em;word-break:break-all}
    .card{border:1px solid #eee;border-radius:8px;padding:16px 20px;margin-bottom:16px}
    .card h2{margin:0 0 6px;font-size:1.15em}
    .card p{margin:0 0 10px;color:#444}
    .card .links a{margin-right:14px;font-weight:600;text-decoration:none}
    .empty{color:#777;font-style:italic}
    hr{margin:32px 0;border:none;border-top:1px solid #eee}
  </style>
</head>
<body>
  <h1>Plugin Updates</h1>
  <p class='meta'>Self-hosted WordPress update feeds for VCNS Tech plugins.</p>

  <div id='products'>
    <p class='empty'>Loading products&hellip;</p>
  </div>

  <hr>
  <p>Each plugin polls its own <code>update.json</code> endpoint at <code>&lt;slug&gt;/update.json</code>. See <a href='https://github.com/vcns/wp-updates#readme'>README</a> for how to onboard a new product.</p>

  <script>
    fetch('products.json')
      .then(function (res) { return res.json(); })
      .then(function (products) {
        var container = document.getElementById('products');
        if (!products.length) {
          container.innerHTML = '<p class="empty">No products published yet.</p>';
          return;
        }
        container.innerHTML = products.map(function (p) {
          return '<div class="card">' +
            '<h2>' + p.name + '</h2>' +
            '<p>' + (p.description || '') + '</p>' +
            '<div class="links">' +
              '<a href="' + p.slug + '/">Details</a>' +
              '<a href="' + p.slug + '/update.json">update.json</a>' +
            '</div>' +
          '</div>';
        }).join('');
      })
      .catch(function () {
        document.getElementById('products').innerHTML =
          '<p class="empty">Could not load products.json.</p>';
      });
  </script>
</body>
</html>
